# Reverse proxy for the gym tracker.
#
# Save as /etc/nginx/sites-available/gym, symlink into sites-enabled, then run
# `certbot --nginx -d gym.example.com`. Certbot rewrites the listen block and
# adds the certificate lines itself, so start with plain HTTP here.

server {
    listen 80;
    listen [::]:80;
    server_name gym.example.com;

    # Progress photos and Health payloads are the big uploads. 20M leaves room
    # for a HEIC burst without letting a runaway request fill the disk.
    client_max_body_size 20M;

    # The Claude call for a generated workout can take the better part of a
    # minute. Nginx's 60s default cuts it off mid-response and the browser sees
    # a 504 for a workout that was actually being built.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Next.js hashes these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
